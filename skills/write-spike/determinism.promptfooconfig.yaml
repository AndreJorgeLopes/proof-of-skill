# Determinism assertions for write-spike (Axis B)
# Run: promptfoo eval -c determinism.promptfooconfig.yaml
# These assert on stdout format constraints — not content quality.

description: write-spike determinism harness

prompts:
  - '{{prompt}}'

providers:
  # run-skill.sh clears CLAUDECODE so the nested claude launches (sdk#573); $1 = prompt.
  - id: 'exec: bash run-skill.sh'
    label: write-spike@head

tests:
  # D4 — Phase 2.2 knowledge-category values must be A, B1, B2, or C
  - description: "D4: knowledge categories are A|B1|B2|C only"
    vars:
      prompt: >
        Run only Phase 3 of write-spike with a trivial scope: one goal, no ticket.
        Output ONLY the knowledge-classification table (one row), no prose, no fences:
        | Goal | Category | Confidence | Source |
    assert:
      - type: regex
        value: "\\|\\s*(A|B1|B2|C)\\s*\\|"

  # D5 — quality-gates table must be present and structured
  - description: "D5: quality-gate output contains pipe-delimited rows"
    vars:
      prompt: >
        Run only the Phase 3.4 quality-gate check for a trivial spike with all gates
        passing. Output ONLY the gate table, no prose, no fences.
    assert:
      - type: regex
        value: "\\|\\s*(Completeness|Cross-team|Effort|Options|DB strategy|Testing|Diagrams|Business alignment|Company patterns|Two outputs)\\s*\\|"
      - type: not-icontains
        value: "```"

  # D6 — scope-check threshold must fire on numeric signals, not prose judgment
  - description: "D6: scope check output contains a binary flag (DECOMPOSE or OK)"
    vars:
      prompt: >
        You are running only the Phase 1 scope check for a spike with 35 goals and
        12 external dependencies. Output exactly one word on the first line: DECOMPOSE
        or OK.
    assert:
      - type: regex
        value: "^(DECOMPOSE|OK)"
      - type: not-icontains
        value: "```"

  # D2 — workspace-type classification must be one of four enum values
  - description: "D2: workspace-type detection outputs an enum value"
    vars:
      prompt: >
        Detect workspace type for a directory containing one package.json and no
        sub-repos. Output ONLY one of: single-repo | parent-folder | multi-repo-worktree | external-folder
    assert:
      - type: regex
        value: "^(single-repo|parent-folder|multi-repo-worktree|external-folder)$"

  # D3 — repo-priority split must produce deterministic percentages
  - description: "D3: top-20-percent repo count is an integer, not a narrative"
    vars:
      prompt: >
        Given 10 repos for a spike, how many are in the top 20%?
        Output ONLY an integer.
    assert:
      - type: regex
        value: "^[0-9]+$"
      - type: not-icontains
        value: "```"
